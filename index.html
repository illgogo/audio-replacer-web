<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Audio Replacer</title>

  <style>
    body { font-family: Arial; padding: 30px; max-width: 600px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    input { margin-bottom: 10px; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>

  <!-- Старий FFmpeg глобально -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>

<h2>Audio Replacer (WEB Version)</h2>

<label>Choose MP4 video:</label><br>
<input type="file" id="videoInput" accept="video/mp4" multiple><br>

<label>Choose WAV audio:</label><br>
<input type="file" id="audioInput" accept="audio/wav"><br>

<label>Output suffix:</label><br>
<input type="text" id="suffix" value="_new"><br>

<button onclick="process()">Replace Audio</button>

<p id="status"></p>

<script>
  // Глобальний FFmpeg
  const { createFFmpeg, fetchFile } = FFmpeg;

  const ffmpeg = createFFmpeg({
    log: true,
    corePath: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"
  });

  async function process() {
    const status = document.getElementById("status");
    const videoFiles = document.getElementById("videoInput").files;
    const audioFile = document.getElementById("audioInput").files[0];
    const suffix = document.getElementById("suffix").value;

    if (videoFiles.length === 0 || !audioFile) {
      alert("Choose both video(s) and audio!");
      return;
    }

    try {
      status.innerText = "Loading FFmpeg (first run 20–30 sec)...";

      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      // Завантажуємо WAV у пам'ять один раз
      const audioData = await fetchFile(audioFile);

      for (let i = 0; i < videoFiles.length; i++) {

        const videoFile = videoFiles[i];

        status.innerText =
          `Processing ${i + 1} / ${videoFiles.length}: ${videoFile.name}`;

        // Очищаємо попередні файли FFmpeg
        try {
          ffmpeg.FS('unlink', 'input.mp4');
        } catch (e) {}

        try {
          ffmpeg.FS('unlink', 'audio.wav');
        } catch (e) {}

        try {
          ffmpeg.FS('unlink', 'output.mp4');
        } catch (e) {}

        // Записуємо поточне відео
        ffmpeg.FS(
          'writeFile',
          'input.mp4',
          await fetchFile(videoFile)
        );

        // Записуємо WAV
        ffmpeg.FS(
          'writeFile',
          'audio.wav',
          audioData
        );

        // Підміняємо аудіо
        await ffmpeg.run(
          '-i', 'input.mp4',
          '-i', 'audio.wav',
          '-map', '0:v',
          '-map', '1:a',
          '-c:v', 'copy',
          'output.mp4'
        );

        // Отримуємо результат
        const data = ffmpeg.FS('readFile', 'output.mp4');

        const blob = new Blob(
          [data.buffer],
          { type: 'video/mp4' }
        );

        const url = URL.createObjectURL(blob);

        // Формуємо назву так само, як у старій версії
        const dotIndex = videoFile.name.lastIndexOf('.');

        const outputName =
          videoFile.name.substring(0, dotIndex) +
          suffix +
          videoFile.name.substring(dotIndex);

        // Запускаємо завантаження
        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;
        a.click();

        // Звільняємо URL
        URL.revokeObjectURL(url);
      }

      status.innerText =
        `Done! Processed ${videoFiles.length} file(s).`;

    } catch (err) {
      console.error(err);
      status.innerText = "Error: " + err.message;
    }
  }
</script>

</body>
</html>
