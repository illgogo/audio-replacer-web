<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Audio Replacer</title>

  <style>
    body { font-family: Arial; padding: 30px; max-width: 600px; }
    button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
    input { margin-bottom: 10px; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Audio Replacer (Browser)</h2>

<label>Choose MP4 video:</label><br>
<input type="file" id="videoInput" accept="video/mp4"><br>

<label>Choose WAV audio:</label><br>
<input type="file" id="audioInput" accept="audio/wav"><br>

<label>Output suffix:</label><br>
<input type="text" id="suffix" value="_new"><br>

<button id="processBtn">Replace Audio</button>

<p id="status"></p>

<script type="module">
  import { createFFmpeg, fetchFile } from
    'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js';

  const status = document.getElementById("status");

  const ffmpeg = createFFmpeg({
    log: true,
    corePath:
      "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/ffmpeg-core.js"
  });

  document.getElementById("processBtn").addEventListener("click", async () => {

    const videoFile = document.getElementById("videoInput").files[0];
    const audioFile = document.getElementById("audioInput").files[0];
    const suffix = document.getElementById("suffix").value;

    if (!videoFile || !audioFile) {
      alert("Choose both files!");
      return;
    }

    try {

      status.innerText = "Loading FFmpeg (first run ~15 sec)...";
      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      status.innerText = "Writing files...";
      ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(videoFile));
      ffmpeg.FS('writeFile', 'audio.wav', await fetchFile(audioFile));

      status.innerText = "Processing...";
      await ffmpeg.run(
        '-i', 'input.mp4',
        '-i', 'audio.wav',
        '-map', '0:v',
        '-map', '1:a',
        '-c:v', 'copy',
        'output.mp4'
      );

      status.innerText = "Preparing download...";

      const data = ffmpeg.FS('readFile', 'output.mp4');
      const blob = new Blob([data.buffer], { type: 'video/mp4' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = videoFile.name.replace(".mp4", suffix + ".mp4");
      a.click();

      status.innerText = "Done!";

    } catch (err) {
      console.error(err);
      status.innerText = "Error: " + err.message;
    }

  });
</script>

</body>
</html>
